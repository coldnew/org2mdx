[package]
name = "org2mdx"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "org2mdx"
path = "src/main.rs"

[lib]
name = "org2mdx"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
clap = { version = "4.5", features = ["derive"] }
markdown = "1.0"
serde_yaml = "0.9"

[dev-dependencies]
serde_yaml = "0.9"
